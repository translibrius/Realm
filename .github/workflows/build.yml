name: Build & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update vcpkg
        run: |
          git -C $env:VCPKG_ROOT fetch origin
          git -C $env:VCPKG_ROOT checkout -f $((Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline')

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - name: Install LLVM and Ninja
        run: |
          choco install llvm ninja -y
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/ci/vcpkg_installed
          key: vcpkg-win-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-win-

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/ci/vcpkg_installed
          key: vcpkg-mac-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-mac-

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

  sanitizers:
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: /usr/local/share/vcpkg

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update vcpkg
        run: |
          git -C "$VCPKG_ROOT" fetch origin
          git -C "$VCPKG_ROOT" checkout -f "$(jq -r '.["builtin-baseline"]' vcpkg.json)"

      - name: Install Clang 19, Ninja, and OpenGL headers
        run: sudo apt-get update && sudo apt-get install -y clang-19 ninja-build libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/ci/vcpkg_installed
          key: vcpkg-linux-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-linux-

      - name: Configure
        run: >
          cmake --preset ci
          -DCMAKE_C_COMPILER=clang-19
          -DCMAKE_CXX_COMPILER=clang++-19
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --preset ci
